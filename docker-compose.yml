services:
  app:
    image: openpos-app:latest
    build: .
    container_name: openpos-interactive
    volumes:
      - .:/app
      - node_modules_vol:/app/node_modules
    # By default, running 'docker-compose up' will start the 
    # interactive UI (the entrypoint with no arguments).
    # To run CLI commands, use: docker-compose run --rm app [args]
    # Example: docker-compose run --rm app add user juan 1234
    stdin_open: true
    tty: true
    environment:
      - DATABASE_URL=pos.db

  web:
    image: openpos-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: openpos-web
    ports:
      - "3000:3000"
    volumes:
      - ./pos.db:/app/pos.db
      - ./config.json:/app/config.json
      - ./assets:/app/assets
    environment:
      - DATABASE_URL=pos.db
      - NODE_ENV=production

volumes:
  node_modules_vol:
