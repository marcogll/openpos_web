services:
  postgres:
    image: postgres:16-alpine
    container_name: openpos-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: openpos
      POSTGRES_USER: openpos
      POSTGRES_PASSWORD: openpos123
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: openpos-app:latest
    build: .
    container_name: openpos-interactive
    volumes:
      - .:/app
      - node_modules_vol:/app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://openpos:openpos123@postgres:5432/openpos

  web:
    image: openpos-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: openpos-web
    ports:
      - "3001:3001"
    volumes:
      - ./assets:/app/assets
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://openpos:openpos123@postgres:5432/openpos
      - NODE_ENV=production

volumes:
  pgdata:
  node_modules_vol:
